# ============================
# Peak Fit Backend - Production (Railway)
# ============================

# Railway injects MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# JWT - set in Railway env vars
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# OpenRouter - set in Railway env vars
openrouter.api.key=${OPENROUTER_API_KEY}

# Frontend URL - set in Railway env vars
frontend.url=${FRONTEND_URL}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Force HTTPS cookies in prod
server.servlet.session.cookie.secure=true
