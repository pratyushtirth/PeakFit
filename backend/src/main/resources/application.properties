spring.application.name=peakfit-backend
server.port=8081

# Local MySQL configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/peakfit_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OpenRouter
openrouter.api.key=${OPENROUTER_API_KEY:}

# CORS
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Disable Spring Security default user
spring.security.user.name=disabled
spring.security.user.password=disabled

# Logging
logging.level.org.springframework.orm.jpa.support.OpenEntityManagerInViewInterceptor=ERROR